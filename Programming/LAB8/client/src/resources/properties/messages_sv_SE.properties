server.command.help.text=Hjälp för tillgängliga funktioner:\n    - Knapp "i" : få information om samlingen\n    - Knapp "◴" : få dina senaste 10 kommandon\n    - Knapp "+ Lägg till" : lägg till ett nytt element\n    - Knapp "Skript" : exekvera ett skript från en fil\n    - Knapp "Radera" : radera det valda elementet\n    - update : uppdatera element via ID\n    - remove_by_id : radera via ID\n    - clear : rensa samlingen\n    - add_if_min : lägg till om värdet är minimalt\n    - remove_greater : radera alla element som är större än det angivna\n    - sum_of_number_of_participants : summa av deltagare\n    - average_of_number_of_participants : genomsnitt av deltagare

