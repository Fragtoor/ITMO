server.command.help.text=Hjälp med tillgängliga funktioner:\n    - Knapp "i" : få information om samlingen\n    - Knapp "◴" : få de senaste 10 kommandona\n    - Knapp "+ Lägg till" : lägg till ett nytt element\n    - Knapp "Skript" : kör skript från fil\n    - Knapp "Ta bort" : ta bort valt element\n    - update : uppdatera element via ID\n    - remove_by_id : ta bort via ID\n    - clear : rensa samlingen\n    - add_if_min : lägg till om värdet är minimum\n    - remove_greater : ta bort alla element större än angivet\n    - sum_of_number_of_participants : summa deltagare\n    - average_of_number_of_participants : genomsnitt deltagare

