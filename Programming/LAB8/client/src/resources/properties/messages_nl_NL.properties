server.command.help.text=Hulp bij beschikbare functies:\n    - Knop "i" : informatie over de collectie verkrijgen\n    - Knop "◴" : laatste 10 commando's ophalen\n    - Knop "+ Toevoegen" : nieuw element toevoegen\n    - Knop "Script" : script uitvoeren vanuit bestand\n    - Knop "Verwijderen" : geselecteerd element verwijderen\n    - update : element bijwerken op ID\n    - remove_by_id : verwijderen op ID\n    - clear : collectie wissen\n    - add_if_min : toevoegen indien waarde minimaal is\n    - remove_greater : alle elementen groter dan opgegeven verwijderen\n    - sum_of_number_of_participants : som van deelnemers\n    - average_of_number_of_participants : gemiddelde van deelnemers

