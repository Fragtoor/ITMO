server.command.help.text=Hulp voor beschikbare functies:\n    - Knop "i" : krijg informatie over de collectie\n    - Knop "◴" : krijg je laatste 10 commando's\n    - Knop "+ Toevoegen" : voeg een nieuw element toe\n    - Knop "Script" : voer een script uit vanuit een bestand\n    - Knop "Verwijderen" : verwijder het geselecteerde element\n    - update : werk element bij via ID\n    - remove_by_id : verwijder via ID\n    - clear : collectie wissen\n    - add_if_min : voeg toe indien waarde minimaal is\n    - remove_greater : verwijder alle elementen groter dan opgegeven\n    - sum_of_number_of_participants : som van deelnemers\n    - average_of_number_of_participants : gemiddelde van deelnemers

